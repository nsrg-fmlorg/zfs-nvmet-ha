name: joinstall-timing

# The join stall with no traffic dropped: corosync's token shortened so
# that the DC sees the killed node leave before systemd has it back, with
# a few restart delays.  The distribution's pacemaker, without the fix.

on:
  workflow_dispatch:
    inputs:
      token:
        description: corosync totem token in ms
        default: '1000'
  push:
    branches: [main]
    paths:
      - '.github/workflows/joinstall-timing.yml'

concurrency:
  group: joinstall-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  joinstall:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        restart_sec: [1, 3, 5]
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
              qemu-system-x86 qemu-utils cloud-image-utils
          sudo chmod 666 /dev/kvm

      - name: Cache the cloud image
        uses: actions/cache@v4
        with:
          path: work/base.img
          key: alma9-cloudimg-${{ github.run_id }}
          restore-keys: alma9-cloudimg-

      - name: Boot VMs
        run: DISTRO=alma sh lab/vms.sh up

      - name: Scenario
        timeout-minutes: 35
        run: |
          set -o pipefail
          mkdir -p work/out
          TOKEN=${{ inputs.token || '1000' }} RESTART_SEC=${{ matrix.restart_sec }} PARTITION_SEC=0 \
              PCMK_VERSION=latest sh lab/joinstall.sh 2>&1 | tee work/out/scenario.txt

      - name: Summary
        if: always()
        run: |
          { echo "## token ${{ inputs.token || '1000' }}, RestartSec ${{ matrix.restart_sec }} / run ${{ matrix.run }}"; cat work/out/summary.md; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joinstall-timing-r${{ matrix.restart_sec }}-${{ matrix.run }}-logs
          path: work/out
