# Two controllers sharing dual-ported NVMe drives.  The inventory names
# must be the nodes' hostnames: Pacemaker and corosync know them by it.
# zfs_ha_addr is the storage network address the host connects to and
# the cluster talks over.  Every value below is an example.
[zfs_ha]
ctl-a ansible_host=192.0.2.11 zfs_ha_addr=198.51.100.11 zfs_ha_nodeid=1 zfs_ha_hostid="0x0000a001" zfs_ha_cntlid_min=1 zfs_ha_cntlid_max=999 zfs_ha_port_id=1
ctl-b ansible_host=192.0.2.12 zfs_ha_addr=198.51.100.12 zfs_ha_nodeid=2 zfs_ha_hostid="0x0000a002" zfs_ha_cntlid_min=1000 zfs_ha_cntlid_max=1999 zfs_ha_port_id=2
