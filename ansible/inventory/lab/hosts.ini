# The lab's VMs (lab/vms.sh with DISTRO=alma), reached through qemu's
# forwarded ssh ports on the runner.
[zfs_ha]
ctl-a ansible_port=2221 zfs_ha_addr=10.10.0.11 zfs_ha_nodeid=1 zfs_ha_hostid="0x0000a001" zfs_ha_cntlid_min=1 zfs_ha_cntlid_max=999 zfs_ha_port_id=1
ctl-b ansible_port=2222 zfs_ha_addr=10.10.0.12 zfs_ha_nodeid=2 zfs_ha_hostid="0x0000a002" zfs_ha_cntlid_min=1000 zfs_ha_cntlid_max=1999 zfs_ha_port_id=2

[zfs_ha:vars]
ansible_host=127.0.0.1
ansible_user=ubuntu
ansible_ssh_private_key_file=../work/id_ed25519
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
