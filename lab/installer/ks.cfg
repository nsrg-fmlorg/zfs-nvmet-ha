# Kickstart for lab/installer/run.sh.  run.sh fills in @S0@, @S1@ (the
# shared drives' PCI slots) and @CASE@.
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc
rootpw --plaintext lab
network --bootproto=dhcp
%include /run/part.ks

%pre --erroronfail
exec > /dev/ttyS0 2>&1
probe() {
	echo "=== $1"
	cat /proc/mdstat
	lsblk -o NAME,SERIAL,TYPE,SIZE
	dmsetup ls
	for b in @S0@ @S1@; do echo "$b driver: $(readlink /sys/bus/pci/devices/$b/driver)"; done
	if [ -e /dev/nvme1n1 ]; then
		mdadm --examine /dev/nvme1n1
		dd if=/dev/nvme1n1 bs=4096 skip=1 count=1 status=none | od -A d -t x1 | head -n 16
		cat /sys/block/nvme1n1/queue/logical_block_size
	fi
	echo "=== end $1"
}
probe pre
if [ @CASE@ = pre-teardown ]; then
	vgchange -an || :
	mdadm --stop --scan || :
	for b in @S0@ @S1@; do
		d=/sys/bus/pci/devices/$b
		echo none > $d/driver_override
		[ -e $d/driver ] && echo $b > $d/driver/unbind
	done
	sleep 2
	probe pre-after-teardown
fi
# Install onto the boot disk only.
b=$(readlink -f /dev/disk/by-id/nvme-QEMU_NVMe_Ctrl_boot 2>/dev/null || readlink -f /dev/disk/by-id/virtio-boot)
b=${b#/dev/}
cat > /run/part.ks <<KS
ignoredisk --only-use=$b
clearpart --all --initlabel --drives=$b
autopart --type=plain
KS
%end

# After the installer has scanned and partitioned: what it assembled.
%pre-install
exec > /dev/ttyS0 2>&1
echo "=== pre-install"
cat /proc/mdstat
lsblk -o NAME,SERIAL,TYPE,SIZE
dmsetup ls
echo "=== end pre-install"
# Nothing past this point is under test.
sync
echo o > /proc/sysrq-trigger
%end

%packages
@core
%end
